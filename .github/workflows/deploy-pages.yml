name: Deploy to GitHub Pages

# Builds the app as a static export and publishes it to GitHub Pages.
# The base path is derived automatically from the repository name, so the site
# works at https://<owner>.github.io/<repo>/.

on:
  push:
    branches:
      - main
      - claude/ecstatic-galileo-feafdr
  workflow_dispatch:

# Permissions required by the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          # "/therapedia" (or whatever the repo is named).
          NEXT_PUBLIC_BASE_PATH: "/${{ github.event.repository.name }}"
          # Show the admin demo on the static site (mock mode, localStorage).
          NEXT_PUBLIC_ENABLE_ADMIN: "true"
        run: npm run build

      - name: Disable Jekyll (serve _next/* correctly)
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
