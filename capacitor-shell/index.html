<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Clinical Protocol Hub</title>
    <style>
      :root { color-scheme: light; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc; color: #1d474a; text-align: center; padding: 24px;
      }
      .logo {
        width: 72px; height: 72px; border-radius: 18px; background: #256d70;
        display: grid; place-items: center; margin: 0 auto 16px;
      }
      .logo span { color: #fff; font-size: 40px; line-height: 1; font-weight: 700; }
      h1 { font-size: 18px; margin: 0 0 6px; }
      p { font-size: 14px; color: #64748b; margin: 4px 0; max-width: 320px; }
      code { background: #e2e8f0; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <!-- This local shell only appears if no remote URL is configured in
         capacitor.config.ts (or while the device is offline). Once you set the
         deployed URL, the native app loads the live app instead. -->
    <div>
      <div class="logo"><span>+</span></div>
      <h1>Clinical Protocol Hub</h1>
      <p>Configura l'URL pubblicato in <code>capacitor.config.ts</code> per caricare l'app.</p>
      <p>Vedi <code>MOBILE.md</code> per le istruzioni complete.</p>
    </div>
  </body>
</html>
